name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier spin down
    - cron: '*/14 * * * *'
  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch: 

jobs:
  ping_server:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request
        # Replaces the placeholder with your actual Render URL or uses a repository secret
        run: |
          echo "Pinging the Render backend..."
          curl -s -o /dev/null -w "HTTP Status Code: %{http_code}\n" ${{ secrets.RENDER_URL }}
