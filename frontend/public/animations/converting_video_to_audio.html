<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converting Video to Audio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', sans-serif;
  }

  @keyframes filmScroll { to { transform: translateY(-13px); } }
  @keyframes arrowPulse { 0%,100%{opacity:0.1} 50%{opacity:0.7} }
  @keyframes bar1 { 0%,100%{height:4px} 50%{height:20px} }
  @keyframes bar2 { 0%,100%{height:14px} 50%{height:4px} }
  @keyframes bar3 { 0%,100%{height:18px} 50%{height:6px} }
  @keyframes bar4 { 0%,100%{height:6px} 50%{height:22px} }
  @keyframes bar5 { 0%,100%{height:16px} 50%{height:4px} }
  @keyframes bar6 { 0%,100%{height:8px} 50%{height:18px} }
  @keyframes cursor { 0%,100%{opacity:1} 50%{opacity:0} }

  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #aaaaaa;
    font-weight: 400;
  }

  .visual {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  /* Film strip */
  .film {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
    height: 52px;
  }
  .frame {
    width: 22px;
    height: 13px;
    border: 0.8px solid #d0d0d0;
    border-radius: 1.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    flex-shrink: 0;
    animation: filmScroll 1.1s linear infinite;
  }
  .fdot { width: 3px; height: 3px; border-radius: 50%; background: #d0d0d0; }

  /* Arrows */
  .arrows {
    display: flex;
    gap: 3px;
    align-items: center;
  }
  .arr {
    width: 6px;
    height: 6px;
    border-top: 1px solid #bbbbbb;
    border-right: 1px solid #bbbbbb;
    transform: rotate(45deg);
    animation: arrowPulse 0.85s ease-in-out infinite;
  }
  .arr:nth-child(2) { animation-delay: 0.2s; }
  .arr:nth-child(3) { animation-delay: 0.4s; }

  /* Wave bars */
  .wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 30px;
  }
  .bar {
    width: 2.5px;
    border-radius: 2px;
    background: #111111;
    align-self: center;
  }
  .b1{animation: bar1 0.9s ease-in-out infinite}
  .b2{animation: bar2 0.9s ease-in-out infinite 0.1s}
  .b3{animation: bar3 0.9s ease-in-out infinite 0.2s}
  .b4{animation: bar4 0.9s ease-in-out infinite 0.15s}
  .b5{animation: bar5 0.9s ease-in-out infinite 0.05s}
  .b6{animation: bar6 0.9s ease-in-out infinite 0.25s}

  .title {
    font-size: 14px;
    font-weight: 500;
    color: #111111;
    letter-spacing: 0.01em;
  }

  .sub {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #aaaaaa;
    display: flex;
    align-items: center;
    min-height: 16px;
  }
  .cursor {
    display: inline-block;
    width: 1.5px;
    height: 10px;
    background: #aaaaaa;
    border-radius: 1px;
    margin-left: 2px;
    animation: cursor 0.9s step-end infinite;
    vertical-align: middle;
  }
</style>
</head>
<body>
<div class="wrap">
  <span class="label">Step 01</span>

  <div class="visual">
    <div class="film">
      <div class="frame"><div class="fdot"></div><div class="fdot"></div></div>
      <div class="frame"><div class="fdot"></div><div class="fdot"></div></div>
      <div class="frame"><div class="fdot"></div><div class="fdot"></div></div>
      <div class="frame"><div class="fdot"></div><div class="fdot"></div></div>
      <div class="frame"><div class="fdot"></div><div class="fdot"></div></div>
    </div>

    <div class="arrows">
      <div class="arr"></div>
      <div class="arr"></div>
      <div class="arr"></div>
    </div>

    <div class="wave">
      <div class="bar b1" style="height:4px"></div>
      <div class="bar b2" style="height:14px"></div>
      <div class="bar b3" style="height:18px"></div>
      <div class="bar b4" style="height:6px"></div>
      <div class="bar b5" style="height:16px"></div>
      <div class="bar b6" style="height:8px"></div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div class="title">Converting video to audio</div>
    <div class="sub"><span id="tw"></span><span class="cursor"></span></div>
  </div>
</div>

<script>
  const phrases = ['Extracting audio stream...', 'Stripping video frames...', 'Exporting .wav file...'];
  let pi = 0, ci = 0, cur = '';
  const el = document.getElementById('tw');
  function tick() {
    const p = phrases[pi];
    if (ci < p.length) { cur += p[ci++]; el.textContent = cur; setTimeout(tick, 55 + Math.random()*30); }
    else { setTimeout(() => { cur=''; el.textContent=''; ci=0; pi=(pi+1)%phrases.length; tick(); }, 1500); }
  }
  tick();
</script>
</body>
</html>
